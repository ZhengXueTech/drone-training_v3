<script type="module">
import * as THREE from 'three';
import { Engine } from '../core/engine.js';
import { InputManager } from '../core/input.js';
import { Drone } from '../core/physics.js';
import { CameraRig, CAM_LABELS } from '../core/camera.js';
import { HUD, DENSITY_LABELS } from '../core/hud.js';
import { UI } from '../core/ui.js';
import { buildBasicField, makeHeadingBeacon } from '../core/world.js';
import { buildDroneStyle, DRONE_STYLES, taskDroneGet } from '../core/drone-styles.js';
import { sfx } from '../core/audio.js';
import { progress } from '../data/progress.js';
import { getLevel } from '../data/levels-manifest.js';
import { Challenge } from '../core/challenge.js';
import { startPanel } from '../core/start-panel.js';
import { showKnowledgeCard } from '../data/knowledge-cards.js';
import { buildCampus } from '../core/campus-model.js';   // 第五天：中正國中校園外型（老師的 3D 校園導覽）

/* ============================================================
   職業線：無人機外送「開業第一週」（2026-11-28 老師定案）
   ------------------------------------------------------------
   每一天＝簡報（客戶訊息）→ 飛 → 回顧（飛行軌跡標出哪裡晃、哪裡撞）→ 說教（知識卡）
   穩定控制的核心：貨物「完整度」——水平加速度（急推、急停）超過貨物能承受的門檻就扣，
   撞到建築、重落地另外扣。分數看穩不看快。
     第一天 生日蛋糕（最怕晃）        第二天 滿杯珍奶送進窄巷（有遮雨棚，只能低飛鑽進去）
     第三天 高樓陽台（大樓旁有陣風，要輕輕降落）  第四天 午餐尖峰（三張單連送，有時間限制）
     第五天 校慶空拍（等校園模型，先顯示即將推出）
   交貨＝降落在客人的停機墊上停穩 1 秒（真實法規不能從空中丟下去）。
   ============================================================ */
const LEVEL_ID='career-delivery';
const LEVEL=getLevel(LEVEL_ID)||{title:'職業線：無人機外送',hud:{battery:false,wind:false,minimap:true,telemetry:true,gpbar:true,attitude:false}};
progress.migrateLegacy();

/* ── 引擎與系統 ── */
const engine=new Engine(document.getElementById('c'),{lowQuality:innerWidth<600});
const input=new InputManager();
const ch=new Challenge({levelId:LEVEL_ID,input});
const hud=new HUD(ch.hudFeatures(LEVEL.hud));
const ui=new UI(input);
ch.ui=ui; ch.setHud(hud);
const BX=22, BZ=22, BY=36;   // 2026-11-28 比例標準：一層樓 3 m，最高 10 樓 30 m
const rig=new CameraRig(engine.camera,{pilotPositions:[
  new THREE.Vector3(0,1.7,20), new THREE.Vector3(-14,1.7,18), new THREE.Vector3(16,1.7,14)]});
buildBasicField(engine.scene,{size:BX,sky:0x16233a,skipCompassMark:true});

/* ── 小鎮：所有建築都是 AABB，碰撞自己處理（core Drone 只管場地邊界） ── */
const boxes=[];   // {min,max,name}
const town=new THREE.Group(); engine.scene.add(town);
const edgeMat=new THREE.LineBasicMaterial({color:0x9fb8d8,transparent:true,opacity:0.45});
function block(x0,x1,z0,z1,y0,y1,color,name,solid=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),new THREE.MeshStandardMaterial({color,roughness:0.85}));
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); m.castShadow=m.receiveShadow=true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),edgeMat));
  town.add(m);
  // 比例標準：樓高 3 m 一層，外牆畫樓層線（一眼看得出幾樓）
  if(y0===0&&y1-y0>=5.5){ const fm=new THREE.MeshStandardMaterial({color:0xe8edf3,roughness:1});
    for(let y=3;y<y1-0.5;y+=3){ const f=new THREE.Mesh(new THREE.BoxGeometry(x1-x0+0.06,0.12,z1-z0+0.06),fm); f.position.set((x0+x1)/2,y,(z0+z1)/2); town.add(f); } }
  if(solid)boxes.push({min:new THREE.Vector3(x0,y0,z0),max:new THREE.Vector3(x1,y1,z1),name});
  return m;
}
function label(text,x,y,z,yaw=0,w=3.2,color='#ffe08a'){
  const c=document.createElement('canvas'); c.width=256; c.height=64; const g=c.getContext('2d');
  g.fillStyle='rgba(10,18,32,.92)'; g.fillRect(0,0,256,64); g.fillStyle=color;
  g.font='bold 34px system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,128,34);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const grp=new THREE.Group(), geo=new THREE.PlaneGeometry(w,w/4), mat=new THREE.MeshBasicMaterial({map:t});
  const a=new THREE.Mesh(geo,mat); a.position.z=0.01; grp.add(a);
  const b=new THREE.Mesh(geo,mat); b.rotation.y=Math.PI; b.position.z=-0.01; grp.add(b);   // 雙面，背面字不顛倒
  grp.position.set(x,y,z); grp.rotation.y=yaw; town.add(grp); return grp;
}
// 店（起點）
block(-4,4,17,21,0,4,0x8a5a3c,'店');
label('🛵 飛快外送',0,4.6,16.9,0,4);
// 住宅區（第一天目的地在 -12,-6 的前院）
block(-18,-13,-12,-8,0,9,0x6f7f95,'住宅A'); block(-20,-14,-2,3,0,12,0x7d6f95,'住宅B');   // 3 樓、4 樓透天
block(-8,-4,-14,-10,0,6,0x957d6f,'住宅C');
// 窄巷（第二天）：兩排長樓夾出 2.6 m 寬的巷子，上面有遮雨棚，盡頭封死
block(6,10.7,-12,4,0,15,0x5d6b7a,'巷左樓'); block(13.3,18,-12,4,0,15,0x6a5d7a,'巷右樓');   // 5 樓公寓夾出來的巷子
block(10.7,13.3,-12,-11.4,0,15,0x4b5566,'巷底牆');
{ const roof=block(10.7,13.3,-12,4,3.4,3.6,0x3b6e5a,'遮雨棚');   // 半透明：跟機鏡頭在棚子上方也看得到巷子裡
  roof.material.transparent=true; roof.material.opacity=0.35; roof.material.depthWrite=false; roof.castShadow=false; }
block(10.7,11.5,-2.5,-1.7,1.4,2.2,0xa0a8b0,'冷氣機');   // 巷子裡突出的冷氣機：要左右閃
block(12.5,13.3,-6.5,-5.7,0.9,1.7,0xa0a8b0,'冷氣機');
label('巷子',12,4.6,4.2,0,2.4,'#c9f2d8');
// 高樓（第三天）：陽台在 7 m 高
block(-17,-11,8,14,0,30,0x47566e,'高樓');   // 10 樓大樓；7 樓樓板在 18 m
block(-11,-9,9.6,12.4,17.8,18.0,0x9aa6b4,'陽台');
block(-9.1,-9,9.6,12.4,18.0,19.1,0x9aa6b4,'陽台欄杆');   // 欄杆 1.1 m（建築法規高度）
label('翠峰大樓',-14,30.8,7.9,0,4,'#cfe0ff');
label('7F',-10.6,20.2,9.5,0,1.4,'#f9a8d4');
// 公園（第四天）
const park=new THREE.Mesh(new THREE.CircleGeometry(5,40),new THREE.MeshStandardMaterial({color:0x2f6b3a,roughness:1}));
park.rotation.x=-Math.PI/2; park.position.set(4,0.02,-16); town.add(park);
[[1,-19],[7.5,-18.5],[2,-13]].forEach(([x,z])=>{ block(x-0.2,x+0.2,z-0.2,z+0.2,0,2.2,0x5b3d26,'樹');
  const cr=new THREE.Mesh(new THREE.SphereGeometry(1.1,10,8),new THREE.MeshStandardMaterial({color:0x2e7d4a,roughness:1}));
  cr.position.set(x,2.9,z); town.add(cr); boxes.push({min:new THREE.Vector3(x-0.9,2.1,z-0.9),max:new THREE.Vector3(x+0.9,3.8,z+0.9),name:'樹'}); });

/* ── 停機墊（交貨點） ── */
function makePad(x,y,z,color,text,parent=town){
  const g=new THREE.Group();
  const d=new THREE.Mesh(new THREE.CircleGeometry(0.9,36),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.35}));
  d.rotation.x=-Math.PI/2; g.add(d);
  const r=new THREE.Mesh(new THREE.RingGeometry(0.85,0.95,40),new THREE.MeshBasicMaterial({color}));
  r.rotation.x=-Math.PI/2; r.position.y=0.005; g.add(r);
  const H=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.7}));
  H.rotation.x=-Math.PI/2; H.position.y=0.006; g.add(H);
  g.position.set(x,y+0.02,z); parent.add(g);
  if(text)label(text,x,y+3.2,z,0,2.2,'#ffffff');
  return {g,x,y,z,r:0.95};
}
const PADS={
  shop: makePad(0,0,9,0xfacc15,null),
  house:makePad(-12,0,-5.5,0x60a5fa,'🏠 林小姐'),
  alley:makePad(12,0,-9.8,0x4ade80,null),
  balcony:makePad(-10,18.0,11,0xf472b6,null),
  park: makePad(4,0,-16,0xfb923c,'🌳 公園野餐'),
  gate: makePad(16.5,0,8.5,0xa78bfa,'🏢 巷口公司'),
};

/* ── 每一天的設定 ── */
const GOODS={cake:{icon:'🎂',name:'蛋糕',thr:1.0},tea:{icon:'🧋',name:'珍奶',thr:1.15},vase:{icon:'🏺',name:'花瓶',thr:1.3},lunch:{icon:'🥤',name:'飲料',thr:1.15},cam:{icon:'🎥',name:'畫面品質',thr:1.1}};
const DAYS=[
  {n:1,title:'生日蛋糕',goods:'cake',stops:['house'],time:0,
    from:'林小姐',msg:['我女兒今天生日，蛋糕 2 點前要到喔！','奶油很軟，<b>拜託不要晃</b>，上次別家送來整個塌掉 😭'],
    tip:'推桿和放桿都要「慢慢來」：急加速、急煞車都會讓蛋糕晃。'},
  {n:2,title:'窄巷裡的珍奶',goods:'tea',stops:['alley'],time:0,
    from:'巷底工作室 阿哲',msg:['我在巷子最裡面，巷子有遮雨棚，<b>從上面進不來</b>。','珍奶全糖去冰，<b>不要灑出來</b>，巷子裡還有冷氣機凸出來小心。'],
    tip:'低飛從巷口鑽進去，遮雨棚在 3.4 m，冷氣機一左一右要閃。巷子裡可以按 C 切 FPV 看得更清楚。'},
  {n:3,title:'高樓陽台',goods:'vase',stops:['balcony'],time:0,gust:true,
    from:'翠峰大樓 7 樓 陳先生',msg:['花瓶直接送到 7 樓<b>陽台</b>就好，粉紅色停機墊。','大樓旁邊風很亂，<b>降落要輕</b>，不然花瓶會碎。'],
    tip:'7 樓陽台離地 18 m：先升到 20 m 左右停穩、對準，再慢慢往下放。陣風來時不要急著猛拉。'},
  {n:4,title:'午餐尖峰',goods:'lunch',stops:['gate','park','house'],time:150,
    from:'店長',msg:['中午爆單！三杯飲料，<b>巷口公司 → 公園 → 林小姐</b>。','150 秒內送完，但飲料灑了客人一樣會給負評。'],
    tip:'快和穩要平衡：直線可以快一點，快到之前提早減速。'},
  {n:5,title:'校慶開幕空拍',goods:'cam',campus:true,stops:[],shots:['aerial','gate','parade','land'],time:0,
    from:'中正國中 學務處',msg:['校慶開幕要請你們空拍！需要三個鏡頭：<b>全校鳥瞰、正門、開幕進場隊伍</b>。','畫面不能晃。還有，<b>不可以飛到人群正上方</b>，要在旁邊跟拍。'],
    tip:'進到取景框（四角變綠）後放輕搖桿、停住不動，照片才拍得清楚。跟拍隊伍時保持 7～16 m。'},
];
const DIFF={easy:{label:'初級',lossK:2.2,hitLoss:12,gust:1.2,timeK:1.35,thrK:1.5},
            med:{label:'中級',lossK:3.2,hitLoss:18,gust:2.0,timeK:1.0,thrK:1.0},
            hard:{label:'高級',lossK:4.2,hitLoss:25,gust:2.8,timeK:0.85,thrK:0.8}};
const JOLT_BASE=6.0;   // m/s²：中級蛋糕能承受的水平加速度（≈手把推一半；鍵盤 Shift 半舵）（再乘 goods.thr 與難度 thrK）

/* ── 機體 ── */
let styleIdx=Math.max(0,DRONE_STYLES.findIndex(s=>s.code==='cargo-lift'));
let beaconOn=progress.setting('headingBeacon',true);
let mesh=null, beacon=null;
function rebuildMesh(){
  if(mesh)engine.scene.remove(mesh);
  mesh=buildDroneStyle(DRONE_STYLES[styleIdx].code,{showCargo:false});
  mesh.castShadow=true;
  if(taskDroneGet()!=='ball'){   // 比例標準：外送機＝機腹貨箱＋腳架（腳架著地，貨箱不會埋進地板）
    const bm=new THREE.MeshStandardMaterial({color:0xf59e0b,roughness:0.6}), lm=new THREE.MeshStandardMaterial({color:0x2b2f36,roughness:0.7});
    const box=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.1,0.24),bm); box.position.y=-0.06; mesh.add(box);
    [[-0.17,-0.13],[0.17,-0.13],[-0.17,0.13],[0.17,0.13]].forEach(([x,z])=>{ const l=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.15,6),lm); l.position.set(x,-0.075,z); mesh.add(l); });
    [-0.13,0.13].forEach(z=>{ const sk=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.02,0.02),lm); sk.position.set(0,-0.15,z); mesh.add(sk); }); }
  beacon=makeHeadingBeacon(); beacon.visible=beaconOn; mesh.add(beacon);
  engine.scene.add(mesh);
}
const SPAWN=new THREE.Vector3(0,0.2,9);
const drone=new Drone({mode:'arcade',bounds:{x:BX,z:BZ,y:BY},spawn:SPAWN.clone()});
rebuildMesh();

/* ── 第五天：校慶空拍（中正國中校園外型；第一次進入才建，平常藏起來） ── */
let campus=null, inCampus=false, savedFog, hiddenField=[], crowd=null, crowdS=0;
const TOWN_PILOTS=rig.pilotPositions;
let SPAWN5=null;
// 開幕隊伍路線：從正門進來 → 往北 → 繞籃球場一圈（單位公尺，跟校園模型同一套座標）
const CROWD_PATH=[[-8,44],[-8,14],[-44,14],[-44,40],[-8,40],[-8,14]];
const _cp=new THREE.Vector3();
function crowdAt(s){ let segs=[]; for(let i=0;i+1<CROWD_PATH.length;i++){ const a=CROWD_PATH[i], b=CROWD_PATH[i+1]; segs.push([a,b,Math.hypot(b[0]-a[0],b[1]-a[1])]); }
  const loopFrom=1, total0=segs[0][2], loopLen=segs.slice(loopFrom).reduce((t,x)=>t+x[2],0);
  if(s>total0) s=total0+((s-total0)%loopLen);
  for(const [a,b,l] of segs){ if(s<=l){ const f=s/l; return {x:a[0]+(b[0]-a[0])*f,z:a[1]+(b[1]-a[1])*f,dx:(b[0]-a[0])/l,dz:(b[1]-a[1])/l}; } s-=l; }
  const L=CROWD_PATH[CROWD_PATH.length-1]; return {x:L[0],z:L[1],dx:0,dz:-1}; }
function buildCrowd(){
  crowd=new THREE.Group(); crowd.userData.people=[];
  const cols=[0x9cc2ea,0x1f3466,0xf2c200,0xd9483b];

const R=0.45;   // 機體半徑（含槳）：外送機翼展約 1 m
function collide(){
  let hit=null;
  for(const b of boxes){
    const p=drone.pos;
    if(p.x<b.min.x-R||p.x>b.max.x+R||p.y<b.min.y-R||p.y>b.max.y+R||p.z<b.min.z-R||p.z>b.max.z+R)continue;
    const pen=[[p.x-(b.min.x-R),'x',-1],[(b.max.x+R)-p.x,'x',1],[p.y-(b.min.y-R),'y',-1],[(b.max.y+R)-p.y,'y',1],[p.z-(b.min.z-R),'z',-1],[(b.max.z+R)-p.z,'z',1]];
    pen.sort((a,c)=>a[0]-c[0]); const [d,ax,s]=pen[0];
    p[ax]+=s*d;
    const v=drone.vel[ax];
    if(ax==='y'&&s>0){ if(v<0){ if(v<-2.2)hit={kind:'land',v:-v,name:b.name}; drone.vel.y=0; } }   // 落在物體上面＝站上去
    else if(v*s<0){ if(Math.abs(v)>0.5)hit={kind:'wall',v:Math.abs(v),name:b.name}; drone.vel[ax]=-v*0.25; }
  }
  if(inCampus)for(const o of campus.obbs){
    const p=drone.pos; if(p.y<o.y0-R||p.y>o.y1+R)continue;
    const cs=Math.cos(o.phi), sn=Math.sin(o.phi), dx=p.x-o.x, dz=p.z-o.z;
    const lx=dx*cs+dz*sn, lz=-dx*sn+dz*cs;   // 方塊本地座標（長邊沿 phi）
    if(Math.abs(lx)>o.hx+R||Math.abs(lz)>o.hz+R)continue;
    const pen=[[o.hx+R-lx,'x',1],[lx+o.hx+R,'x',-1],[o.hz+R-lz,'z',1],[lz+o.hz+R,'z',-1],[o.y1+R-p.y,'y',1],[p.y-(o.y0-R),'y',-1]];
    pen.sort((a,c)=>a[0]-c[0]); const [d,ax,sg]=pen[0];
    if(ax==='y'){ p.y+=sg*d; if(sg>0&&drone.vel.y<0){ if(drone.vel.y<-2.2)hit={kind:'land',v:-drone.vel.y,name:o.name}; drone.vel.y=0; } else if(sg<0&&drone.vel.y>0)drone.vel.y=0; continue; }
    const nx=ax==='x'?cs*sg:-sn*sg, nz=ax==='x'?sn*sg:cs*sg;   // 推出方向（世界座標）
    p.x+=nx*d; p.z+=nz*d;
    const vn=drone.vel.x*nx+drone.vel.z*nz;
    if(vn<0){ if(-vn>0.5)hit={kind:'wall',v:-vn,name:o.name}; drone.vel.x-=1.25*vn*nx; drone.vel.z-=1.25*vn*nz; }
  }
  return hit;
}

      <p><b>貨物完整度</b>：急加速、急煞車（晃動條變黃）會慢慢扣；撞到建築、重落地一次扣很多；扣到 0 就送不成。用鍵盤的話，按住 <b>Shift</b>＝半舵，比較好控制。</p>
      <p>送完會<b>回顧</b>你的飛行軌跡（綠＝穩、黃＝有點晃、紅＝太晃），再看真實世界的無人機外送怎麼做。</p>`,
    pre:[{id:'day',label:'📅 第幾天',value:String(dayIdx),
      options:DAYS.map((d,i)=>({v:String(i),label:(d.soon?'🔜 ':i+1>un?'🔒 ':(b[d.n]?.delivered?'✅ ':''))+`第${d.n}天 ${d.title.replace('（即將推出）','')}`})),
      hint:v=>{ const d=DAYS[+v]; if(d.soon)return '即將推出';
        if(+v+1>un)return '先把前一天送達才會開放'; const bb=b[d.n]; return d.tip+(bb?`　｜最佳：${bb.grade} 級・完整度 ${bb.integrity}%`:''); },
      onChange:v=>{ dayIdx=+v; }}],
    diffs:[{v:'easy',label:'🌱 初級',hint:'貨物比較耐晃・陣風小・時間多'},{v:'med',label:'⚡ 中級',hint:'標準'},{v:'hard',label:'💀 高級',hint:'貨物很嬌貴・陣風大'}],
    startLabel:'📱 看客人訊息',onStart:d=>{ pDiff=d; const dd=DAYS[dayIdx];
      if(dd.soon){ hud.toast('第五天校慶空拍還在準備中（等校園模型）','warn'); return; }
      if(dayIdx+1>unlockedDay()){ hud.toast('先完成前一天才會開放','warn'); return; }
      showBrief(); }});
}
function showBrief(){
  playing=false; frameEl.style.display='none';
  day=DAYS[dayIdx];
  ui.showModal({title:`📱 第${day.n}天・${day.title}`,
    html:`<div class="msg"><b class="from">${day.from}</b><br>${day.msg.join('<br>')}</div>
      <p style="font-size:14px;opacity:.85">${GOODS[day.goods].icon} 貨物：${GOODS[day.goods].name}　${day.time?`⏱ 限時 ${Math.round(day.time*DIFF[pDiff].timeK)} 秒`:'⏱ 不限時（但越穩越好）'}</p>
      <p style="font-size:13px;opacity:.7">💡 ${day.tip}</p>`,
    buttons:[{id:'b-take',label:'✅ 接單出發',onClick:startDay},{id:'b-back',label:'← 回開始畫面',onClick:showIntro}],align:'top'});
}
function startDay(){
  day=DAYS[dayIdx];
  integrity=100; hits=0; hardLands=0; jolts=0; stopIdx=0; delivered=[]; tSec=0; timeLeft=day.time?day.time*DIFF[pDiff].timeK:0;
  aS=0; overThr=false; landT=0; gustT=1.5; track=[]; events=[]; recT=0;
  if(day.campus){ enterCampus(); shotIdx=0; shotHold=0; shotGood=0; shotErr=0; shotA=0; shotN=0; photos=[]; crowdViol=0; overCrowd=false; crowdS=8; placeCrowd(crowdS); }
  else exitCampus();
  frameEl.style.display='none';
  drone.reset((day.campus?SPAWN5:SPAWN).clone()); drone.mode='arcade'; ch.apply(drone); prevYaw=drone.yaw;
  prevVh.set(0,0);
  ui.closeModal(); sfx.play('click');
  engine.simStarted=true; playing=true; finished=false;
  cargoBar.style.display='block'; syncModes();
  hud.setMission(`第${day.n}天・${day.title}`);
  hud.toast(`${GOODS[day.goods].icon} 出發！先慢慢升空`,'ok');
}
function fail(reason){
  if(finished)return; finished=true; playing=false; sfx.play('warn');
  events.push({x:drone.pos.x,z:drone.pos.z,type:'fail'});
  showReview(false,reason);
}
function deliverStop(){
  const pad=curPad(); delivered.push({stop:day.stops[stopIdx],integrity:Math.round(integrity),t:tSec});
  events.push({x:pad.x,z:pad.z,type:'ok'});
  sfx.play('ok'); hud.toast(`✅ 交貨成功（${GOODS[day.goods].name} ${Math.round(integrity)}%）`,'ok');
  stopIdx++;
  if(stopIdx>=day.stops.length){ finished=true; playing=false; sfx.play('finish'); setTimeout(()=>showReview(true),700); }
}

/* ── 回顧：俯視軌跡圖（綠＝穩、黃＝有點晃、紅＝太晃），✕＝撞、▼＝重落地、★＝交貨 ── */
function gradeOf(ok){
  if(!ok)return 'D';
  const avg=delivered.reduce((s,d)=>s+d.integrity,0)/delivered.length;
  const n=track.length||1, shaky=track.filter(p=>p.a>=thr()).length/n;   // 太晃的時間比例也算進評等（穩，不是只看結果）
  if(day.campus&&crowdViol>0)return avg>=50?'B':'C';   // 飛到人群上方：最高 B
  if(avg>=90&&hits===0&&shaky<0.10)return 'S'; if(avg>=75&&shaky<0.25)return 'A'; if(avg>=50)return 'B'; return 'C';
}
function drawReview(cv){
  const W=cv.width, H=cv.height, g=cv.getContext('2d');
  const bx=inCampus?campus.bounds.x:BX, bz=inCampus?campus.bounds.z:BZ, S=Math.min(W/(bx*2),H/(bz*2)), ox=(W-bx*2*S)/2, oz=(H-bz*2*S)/2;
  const X=x=>ox+(x+bx)*S, Z=z=>oz+(z+bz)*S;   // 俯視：上＝-Z（北）
  g.fillStyle='#0e1a2c'; g.fillRect(0,0,W,H);
  g.fillStyle='#2a3a52';
  if(inCampus){ for(const o of campus.obbs){ if(o.name==='樹'||o.name==='風雨操場柱子')continue; g.save(); g.translate(X(o.x),Z(o.z)); g.rotate(o.phi); g.fillRect(-o.hx*S,-o.hz*S,o.hx*2*S,o.hz*2*S); g.restore(); }
    if(PADS.court){ g.strokeStyle='#ffffff'; g.lineWidth=1.5; g.beginPath(); g.arc(X(PADS.court.x),Z(PADS.court.z),Math.max(2,0.95*S),0,7); g.stroke(); } }
  else { for(const b of boxes){ if(b.name==='遮雨棚')continue; g.fillRect(X(b.min.x),Z(b.min.z),(b.max.x-b.min.x)*S,(b.max.z-b.min.z)*S); }
  g.strokeStyle='rgba(74,222,128,.5)'; g.setLineDash([4,3]); const ab=boxes.find(b=>b.name==='遮雨棚'); g.strokeRect(X(ab.min.x),Z(ab.min.z),(ab.max.x-ab.min.x)*S,(ab.max.z-ab.min.z)*S); g.setLineDash([]); }
  for(const k of day.stops){ const p=PADS[k]; g.strokeStyle='#ffffff'; g.lineWidth=1.5; g.beginPath(); g.arc(X(p.x),Z(p.z),0.95*S,0,7); g.stroke(); }
  if(!inCampus){ g.fillStyle='#facc15'; g.beginPath(); g.arc(X(SPAWN.x),Z(SPAWN.z),0.6*S,0,7); g.fill(); }
  const T=thr(); g.lineWidth=3; g.lineCap='round';
  for(let i=1;i<track.length;i++){ const a=track[i-1], b=track[i];
    g.strokeStyle=b.a<T*0.6?'#4ade80':b.a<T?'#facc15':'#f87171';
    g.beginPath(); g.moveTo(X(a.x),Z(a.z)); g.lineTo(X(b.x),Z(b.z)); g.stroke(); }
  g.font='bold 16px system-ui'; g.textAlign='center'; g.textBaseline='middle';
  for(const e of events){ g.fillStyle=e.type==='ok'?'#fde047':e.type==='hit'?'#f87171':e.type==='land'?'#fb923c':'#f43f5e';
    g.fillText(e.type==='ok'?'★':e.type==='hit'?'✕':e.type==='land'?'▼':'💥',X(e.x),Z(e.z)); }
  g.fillStyle='rgba(255,255,255,.55)'; g.font='12px system-ui'; g.textAlign='left'; g.fillText('北 ↑',6,14);
}
function showReview(ok,reason){
  cargoBar.style.display='none'; hud.setOffscreenTarget(null);
  const grade=gradeOf(ok), T=thr();
  const n=track.length||1, steady=Math.round(100*track.filter(p=>p.a<T*0.6).length/n),
        shaky=Math.round(100*track.filter(p=>p.a>=T).length/n);
  // 最晃的三個時刻（間隔至少 2 秒）
  const worst=[]; [...track].sort((a,b)=>b.a-a.a).forEach(p=>{ if(worst.length<3&&p.a>=T&&worst.every(w=>Math.abs(w.t-p.t)>2))worst.push(p); });
  if(ok){ const b=bestOf(), prev=b[day.n], avg=Math.round(delivered.reduce((s,d)=>s+d.integrity,0)/delivered.length);
    const rank={S:4,A:3,B:2,C:1,D:0};
    if(!prev||rank[grade]>rank[prev.grade]||(rank[grade]===rank[prev.grade]&&avg>prev.integrity)){ b[day.n]={delivered:true,grade,integrity:avg,diff:pDiff}; progress.setSetting(KEY,b); } }
  progress.record(LEVEL_ID,{completed:ok,score:ok?Math.round(delivered.reduce((s,d)=>s+d.integrity,0)):0,
    metrics:{day:day.n,grade,integrity:Math.round(integrity),hits,hardLands,steadyPct:steady,time:Math.round(tSec)},...ch.recordFields()});
  const stars={S:'⭐⭐⭐⭐',A:'⭐⭐⭐',B:'⭐⭐',C:'⭐',D:''}[grade];
  const reviewTxt=ok?({S:'客人：「完全沒晃到！下次還找你們。」',A:'客人：「很好，謝謝！」',B:'客人：「有一點點歪，還可以啦。」',C:'客人：「嗯……有點慘，但還是謝謝。」'})[grade]
    :`送件失敗：${reason}`;
  const coach=[];
  if(shaky>15)coach.push('紅色路段很多：推桿和放桿都改成「慢慢推、慢慢放」，不要一次推到底再突然放開。');
  if(hits>0)coach.push(`撞了 ${hits} 次：靠近建築前先停下來、轉好機頭，再慢慢前進。`);
  if(day.campus&&crowdViol>0)coach.push(`飛到人群正上方 ${crowdViol} 次：真實法規不可以在人群聚集的上空飛，跟拍要在旁邊保持距離。`);
  if(hardLands>0)coach.push(`重落地 ${hardLands} 次：快到停機墊時，油門只要輕輕往下，讓它自己慢慢降。`);
  if(!coach.length)coach.push('很穩！可以試試高級難度，或用 FPV 視角再送一次。');
  const html=`<div class="rv-wrap"><div><canvas id="rv-cv" width="260" height="260"></canvas>
      <div class="rv-legend"><span style="color:#4ade80">━ 穩</span>　<span style="color:#facc15">━ 有點晃</span>　<span style="color:#f87171">━ 太晃</span>　★交貨 ✕撞到 ▼重落地</div></div>
    <div class="rv-stats"><div style="font-size:16px;margin-bottom:6px">${reviewTxt}</div>
      ${ok?(day.campus?`🎥 交件分數 <b>${delivered[0].integrity}</b>（照片平均＋畫面品質 ${Math.round(integrity)}%）`:delivered.map((d,i)=>`${GOODS[day.goods].icon} 第 ${i+1} 單：完整度 <b>${d.integrity}%</b>（${Math.round(d.t)} 秒）`).join('<br>')):`${GOODS[day.goods].icon} 完整度：${Math.round(integrity)}%`}<br>
      🟢 穩定飛行 <b>${steady}%</b>　🔴 太晃 ${shaky}%<br>
      ✕ 撞到 ${hits} 次　▼ 重落地 ${hardLands} 次　⏱ ${Math.round(tSec)} 秒<br>
      ${worst.length?`<div style="margin-top:6px;opacity:.85">最晃的時刻：${worst.map(w=>Math.round(w.t)+' 秒').join('、')}</div>`:''}
      <div style="margin-top:8px;padding:8px 10px;background:rgba(255,255,255,.06);border-radius:8px">🧑‍🏫 ${coach.join('<br>')}</div></div></div>${day.campus&&photos.length?`<div class="rv-photos">${photos.map(p=>`<figure>${p.url?`<img src="${p.url}" alt="${p.name}">`:''}${p.name}・${p.score} 分</figure>`).join('')}</div>`:''}`;
  const nextOk=ok&&dayIdx<4;
  ui.showModal({title:ok?`第${day.n}天 完成 · ${grade} 級 ${stars}`:`第${day.n}天 · 送件失敗`,html,
    buttons:[
      {id:'b-learn',label:'📖 真實世界怎麼做',onClick:()=>showKnowledgeCard(ui,LEVEL_ID,()=>showReview(ok,reason))},
      ...(nextOk?[{id:'b-next',label:`第${day.n+1}天 ▶`,onClick:()=>{ dayIdx++; showBrief(); }}]:[]),
      {id:'b-retry',label:'再送一次',onClick:()=>showBrief()},
      {id:'b-menu',label:'選別天',onClick:showIntro}],align:'top'});
  requestAnimationFrame(()=>{ const cv=document.getElementById('rv-cv'); if(cv)drawReview(cv); });
}

/* ── 視角／模式／暫停 ── */
function cycleCam(){ hud.toast('視角：'+CAM_LABELS[rig.cycleMode()],'ok'); syncModes(); }
function syncModes(){ hud.setModes(({arcade:'街機',angle:'角度',pro:'專業'})[drone.mode],CAM_LABELS[rig.mode]); }

  hud.showAttitude(drone.mode!=='arcade'); syncModes(); }

function showPauseModal(){

      {id:'b-redo',label:'重送這一天',onClick:()=>{engine.paused=false;showBrief();}},

addEventListener('keydown',e=>{
  if(e.code==='KeyC')cycleCam();

addEventListener('keyup',e=>{ if(e.code==='KeyZ')rig.crouch=false; });
hud.onCamButton(cycleCam); hud.onPauseButton(togglePause); hud.attachTouch(input);
hud.setMission('選一天開始送貨'); hud.showAttitude(false); syncModes();

/* ── 主迴圈 ── */
const _gust=new THREE.Vector3();
engine.start((dt,simStarted)=>{
  input.update(dt); ui.update(dt);
  if(engine.paused)return;
  const p=input.player(0);
  hud.setGpBar(p.device);
  if(p.device==='gamepad'){
    const camE=p.fnEdge('camCycle'), pilotE=p.fnEdge('pilotCycle'); rig.crouch=p.btn('crouch');
    if(simStarted&&!ui.modalOpen){ if(camE)cycleCam(); if(pilotE)rig.cyclePilot(); }
  }
  if(playing&&!finished){
    ch.update(dt,drone,engine.camera);
    // 第三天：大樓旁陣風（離高樓 7 m 內、高度 3 m 以上）
    if(day.gust){
      const nearT=drone.pos.x<-4&&drone.pos.z>3&&drone.pos.y>8;
      gustT-=dt;
      if(nearT&&gustT<=0){ const a=Math.random()*Math.PI*2, s=DIFF[pDiff].gust*(0.6+Math.random()*0.6);
        _gust.set(Math.cos(a)*s,(Math.random()-0.5)*0.6,Math.sin(a)*s); gustT=1.6+Math.random()*1.8; hud.toast('🌬 陣風！','warn'); }
      if(_gust.lengthSq()>0.001){ drone.vel.addScaledVector(_gust,dt*2.2); _gust.multiplyScalar(Math.pow(0.08,dt)); }
    }
    prevVy=drone.vel.y;
    drone.update(dt,p);
    if(inCampus){ const th=p.throttle||0; drone.pos.y=Math.min(drone.bounds.y,drone.pos.y+(th>0?th*3:th*1.2)*dt); }   // 空拍機爬升較快（約 7 m/s，接近實機）
    const hit=collide();
    tSec+=dt;
    // 晃動＝水平加速度（平滑 0.25 秒）——陣風造成的不算玩家的錯，扣分時減半
    const vh=new THREE.Vector2(drone.vel.x,drone.vel.z), acc=vh.clone().sub(prevVh).length()/Math.max(dt,1e-3); prevVh.copy(vh);
    aS+=(Math.min(acc,40)-aS)*Math.min(1,dt/0.25);
    const T=thr();
    if(aS>T){ integrity-=(aS-T)*DIFF[pDiff].lossK*dt*(_gust.lengthSq()>0.05?0.5:1);
      if(!overThr){ overThr=true; jolts++; } } else if(aS<T*0.8) overThr=false;
    if(hit){
      if(hit.kind==='wall'){ hits++; integrity-=DIFF[pDiff].hitLoss*Math.min(1.6,hit.v/1.5); events.push({x:drone.pos.x,z:drone.pos.z,type:'hit'}); hud.toast(`💥 撞到${hit.name}！`,'warn'); sfx.play('warn'); }
      else { hardLands++; integrity-=DIFF[pDiff].hitLoss*0.8; events.push({x:drone.pos.x,z:drone.pos.z,type:'land'}); hud.toast('▼ 降落太用力！','warn'); }
    }
    if(drone.pos.y<=0.16&&prevVy<-2.2&&!hit){ hardLands++; integrity-=DIFF[pDiff].hitLoss*0.8; events.push({x:drone.pos.x,z:drone.pos.z,type:'land'}); hud.toast('▼ 降落太用力！','warn'); }
    integrity=Math.max(0,integrity);
    recT+=dt; if(recT>=0.1){ recT=0; track.push({x:drone.pos.x,z:drone.pos.z,y:drone.pos.y,a:aS,t:tSec}); }
    // 交貨：停在停機墊上（水平 0.95 m 內、貼著墊子、幾乎不動）1 秒
    let pad=null;
    if(day.campus){ if(inCampus)campusTick(dt); if(day.shots[shotIdx]==='land')pad=PADS.court; } else pad=curPad();
    const onPad=!!pad&&Math.hypot(drone.pos.x-pad.x,drone.pos.z-pad.z)<pad.r&&drone.pos.y<pad.y+0.5&&drone.hSpeed()<0.5;
    landT=onPad?landT+dt:0;
    if(landT>1.0&&playing){ landT=0; day.campus?finishCampus():deliverStop(); }
    if(integrity<=0)fail(day.campus?'畫面晃得太厲害，學校退件':`${GOODS[day.goods].name}${day.goods==='cake'?'塌了':day.goods==='vase'?'碎了':'灑光了'}`);
    if(day.time&&playing){ timeLeft-=dt; if(timeLeft<=0)fail('超過時間，客人取消訂單'); }
    // HUD
    const pct=Math.round(integrity);
    cargoTxt.textContent=`${GOODS[day.goods].icon} ${GOODS[day.goods].name} ${pct}%`+(day.stops.length>1?`　第 ${Math.min(stopIdx+1,day.stops.length)}/${day.stops.length} 單`:'');
    cargoFill.style.width=pct+'%'; cargoFill.style.background=pct>70?'#4ade80':pct>40?'#facc15':'#f87171';
    shakeFill.style.width=Math.min(100,aS/T*70)+'%'; shakeFill.style.background=aS>T?'#f87171':aS>T*0.6?'#facc15':'#4ade80';
    hud.setTimer(day.time?Math.max(0,timeLeft):tSec);
    if(!day.campus){
    const nm=pad===PADS.balcony?'7 樓陽台（粉紅停機墊）':pad===PADS.alley?'巷子最裡面（低飛鑽進去）':pad===PADS.house?'林小姐家前院':pad===PADS.park?'公園野餐':'巷口公司';
    hud.setGuide(onPad?'停穩…交貨中':Math.hypot(drone.pos.x-pad.x,drone.pos.z-pad.z)<8?'🛬 '+landHint(pad):`送到：${nm}`);
    hud.setProgress(day.stops.length>1?`第 ${Math.min(stopIdx+1,day.stops.length)}/${day.stops.length} 單`:`${GOODS[day.goods].icon} ${GOODS[day.goods].name}`);
    hud.setOffscreenTarget(new THREE.Vector3(pad.x,pad.y,pad.z));
    }else if(onPad)hud.setGuide('停穩…降落中');
  }
  mesh.position.copy(drone.pos); mesh.quaternion.copy(drone.q);
  mesh.visible=(rig.mode!=='fpv');
  if(mesh.userData.spin)mesh.userData.spin.rotation.y+=dt*3.2;
  if(beacon&&beacon.visible){ const d=engine.camera.position.distanceTo(drone.pos); beacon.scale.setScalar(THREE.MathUtils.clamp(d/12,1,2.8)); }
  rig.portrait=hud.portrait; rig.update(dt,drone,mesh);
  hud.setTelemetry(drone.pos.y,drone.speed());
  const tg=inCampus?(playing&&day.shots&&day.shots[shotIdx]?[{pos:(day.shots[shotIdx]==='land'?new THREE.Vector3(PADS.court.x,0,PADS.court.z):shotCheck(day.shots[shotIdx]).tgt.clone()),color:0xffffff}]:[])
    :(playing?day.stops.slice(stopIdx):[]).map(k=>({pos:new THREE.Vector3(PADS[k].x,0,PADS[k].z),color:0xffffff}));
  hud.drawMinimap(drone.pos,drone.yaw,inCampus?100:BX,tg);
  if(drone.mode!=='arcade'){ const _e=new THREE.Euler().setFromQuaternion(drone.q,'YXZ'); hud.setAttitude(_e.x,-_e.z); }
  hud.setAnomaly(drone.anomalyT>0);
  hud.update(dt,engine.camera,drone.pos);
});

showIntro();
addEventListener('beforeunload',()=>engine.dispose());
window.ndDebug=()=>({t:+tSec.toFixed(1),landT:+landT.toFixed(2),day:day.n,playing,finished,integrity:Math.round(integrity),aS:+aS.toFixed(2),thr:+thr().toFixed(2),hits,hardLands,stopIdx,pos:drone.pos.toArray().map(v=>+v.toFixed(2))});
window.ndTest={shot:()=>{shotHold=99;shotGood=99;},tp:(x,y,z)=>{drone.pos.set(x,y,z);drone.vel.set(0,0,0);},deliver:()=>deliverStop(),fail:r=>fail(r||'測試'),day:i=>{dayIdx=i;showBrief();},unlockAll:()=>{const b=bestOf();[1,2,3,4].forEach(n=>b[n]=b[n]||{delivered:true,grade:'C',integrity:0});progress.setSetting(KEY,b);}};
</script>
