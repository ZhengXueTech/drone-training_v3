<!-- 現場排行榜（攤位班投影用，2026-11-20）：網址 pages/live.html?gas=<中心 Apps Script 網址>&t=<老師代碼>&c=<攤位班名稱>
     資料用 POST {tcode,action:'live',cls} 跟 Apps Script 要；放在 GitHub 上，不經過 Google 登入，
     瀏覽器登入學校帳號也打得開（直接開 script.google.com 的網址會被 Google 改成 /a/macros/<網域>/ 而打不開）。 -->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>newdrone 現場排行榜</title>
<style>
body{margin:0;background:#07101f;color:#e8f4ff;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 18px;padding:18px 28px}
h1{margin:0;font-size:34px}#at{color:#7f93ad;font-size:15px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:0 28px 28px}
.b{background:#0f1b2e;border:1px solid #23406a;border-radius:16px;padding:14px 18px}.b h2{margin:0 0 8px;font-size:22px;color:#3ee6b0}
.b small{color:#7f93ad;font-size:13px;margin-left:6px}.r{display:flex;justify-content:space-between;font-size:20px;padding:3px 0;border-bottom:1px solid #182a45}
.r:first-of-type{font-size:26px;font-weight:800;color:#ffd166}.r span:first-child{max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#empty{padding:40px 28px;font-size:22px;color:#7f93ad}
footer{position:fixed;right:16px;bottom:10px;font-size:12px;color:#4d6280}
</style></head><body>
<header><h1 id="t">現場排行榜</h1><span id="at">讀取中…（第一次約 10～30 秒）</span></header>
<div id="grid"></div><div id="empty"></div>
<footer>開發：新北市立中正國民中學 何政學教師｜推廣：新北市立中正國中自造教育及科技中心</footer>
<script>
const P=new URLSearchParams(location.search), GAS=P.get('gas')||'', T=P.get('t')||'', C=P.get('c')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let fails=0;
async function load(){
  if(!/^https:\/\/script\.google\.com\//.test(GAS)||!T||!C){ $('at').textContent=''; $('empty').textContent='這個排行榜連結不完整，請從老師後台的「📺 現場排行榜」按鈕打開。'; return; }
  let txt='';
  try{
    const ac=new AbortController(), to=setTimeout(()=>ac.abort(),30000);
    const r=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tcode:T,action:'live',cls:C}),signal:ac.signal});
    clearTimeout(to); txt=await r.text();
    let j; try{ j=JSON.parse(txt); }catch{ throw new Error('雲端回的不是資料（HTTP '+r.status+'）：'+txt.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,120)); }
    if(!j||!j.ok){ $('empty').textContent=(j&&j.error)||'讀取失敗'; return; }
    fails=0;
    $('t').textContent=String(j.school||'').replace(/^.*?[市縣]立/,'')+'｜'+j.cls+'｜無人機現場排行榜';
    $('at').textContent=j.players+' 人參加・'+j.at+' 更新（每 20 秒自動更新）';
    $('empty').textContent=j.boards.length?'':'還沒有人上榜，快來挑戰！';
    $('grid').innerHTML=j.boards.map(b=>'<div class="b"><h2>'+esc(b.name)+'<small>'+(b.low?'秒，越少越好':'分')+'・'+b.n+' 人</small></h2>'+
      b.top.map((x,i)=>'<div class="r"><span>'+(i+1)+'. '+esc(x.label)+'</span><span>'+esc(x.score)+'</span></div>').join('')+'</div>').join('');
  }catch(e){ fails++;
    $('at').textContent='連不上雲端，20 秒後自動重試…（第 '+fails+' 次）';
    if(!$('grid').innerHTML) $('empty').textContent='讀取失敗：'+(e&&e.name==='AbortError'?'雲端 30 秒沒有回應':(e&&e.message||e)); }
}
load(); setInterval(load,20000);
</script></body></html>
