<!DOCTYPE html>
<!-- newdrone 無人機飛行模擬器 © 2026 何政學（新北市立中正國民中學）｜授權 CC BY-NC-SA 4.0（姓名標示─非商業性─相同方式分享），見 LICENSE.md；請保留本聲明 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🔧</text></svg>">
<title>newdrone｜機庫</title>
<!-- ============================================================
     garage.html — 機庫（改裝賽道第一階段，2026-10-09）
     四類零件各三選一、全部開放；數值條即時變化；每個零件一句原理；小任務清單。
     設定存 nd.garage.build（data/parts.js），賽道關卡讀同一份。
     ============================================================ -->
<link rel="stylesheet" href="../core/v3-site.css">
<style>
  /* 2026-11-28 改成 v3 網站風格（老師：改裝賽道頁面風格不對） */
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px 30px;}
  .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;}
  @media (max-width:820px){ .cols{grid-template-columns:1fr;} }
  .box{background:var(--card-a);border:1px solid var(--line);border-radius:22px;padding:20px 22px;}
  .row{margin-bottom:18px;}
  .row h3{margin:0 0 8px;font-size:17px;font-weight:900;color:var(--ink);}
  .opts{display:flex;gap:8px;flex-wrap:wrap;}
  .opts button{flex:1;min-width:96px;min-height:46px;font:inherit;font-size:15px;font-weight:700;background:var(--card2);color:var(--ink);
    border:2px solid var(--line);border-radius:12px;cursor:pointer;padding:8px;}
  .opts button:hover{border-color:var(--acc);}
  .opts button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);}
  .why{font-size:14px;color:var(--sub);margin-top:8px;min-height:36px;line-height:1.6;}
  .bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:15px;}
  .bar span.n{width:44px;color:var(--ink);font-weight:700;}
  .bar .t{flex:1;height:12px;background:var(--card2);border-radius:6px;overflow:hidden;position:relative;}
  .bar .t i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);transition:width .25s;}
  .bar .t b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--acc2);}
  .bar span.v{width:34px;text-align:right;color:var(--sub);font-size:14px;}
  .sum{font-size:15px;line-height:1.8;margin-top:12px;color:var(--ink);}
  .ttl{font-size:17px;font-weight:900;color:var(--ink);}
  .miss{list-style:none;padding:0;margin:8px 0 0;font-size:15px;}
  .miss li{padding:8px 0;border-bottom:1px solid var(--line);}
  .miss li.done{color:var(--acc);}
  .miss small{display:block;color:var(--sub);font-size:13px;margin-top:2px;}
  .go{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .go>*{flex:1;text-align:center;}
  .note{text-align:center;color:var(--sub);font-size:14px;margin:18px 0 0;}
</style>
</head>
<body>
<header class="v3-top">
  <a class="v3-brand" href="../index.html"><span class="v3-logo"></span>NEWDRONE</a>
  <nav><a href="../index.html#ch-race">← 回改裝賽道</a><a href="../index.html">回首頁</a></nav>
</header>
<section class="v3-hero sm">
  <h1>🔧 機庫</h1>
  <p>換零件，組一台適合賽道的無人機。<b>沒有最強的組合</b>：推力大就耗電、電池大就變重——想想這條賽道需要什麼。黃線＝標準機。</p>
</section>
<div class="wrap">
  <div class="cols">
    <div class="box" id="parts"></div>
    <div>
      <div class="box">
        <div id="bars"></div>
        <div class="sum" id="sum"></div>
      </div>
      <div class="box" style="margin-top:14px">
        <div class="ttl">🎯 小任務</div>
        <ul class="miss" id="miss"></ul>
      </div>
      <div class="go">
        <button class="btn sec sm" id="b-reset">↺ 全部換回標準</button>
        <a class="btn pri sm" id="b-race" href="../index.html#ch-race">🏁 選賽道出發</a>
      </div>
    </div>
  </div>
  <p class="note">零件設定存在這台電腦的瀏覽器裡，賽道會自動使用。</p>
</div>
<footer class="v3-foot"><span>開發：新北市立中正國民中學 何政學教師｜推廣：新北市立中正國中自造教育及科技中心</span><span><a href="about.html" style="color:inherit">授權：CC BY-NC-SA 4.0（作者自主開發，歡迎各校非商業使用）</a></span></footer>
<script type="module">
import { applySiteTheme } from '../core/v3-site.js';
applySiteTheme();
import { PART_TYPES, loadBuild, saveBuild, partOf, specOf, bars, enduranceSec, buildLabel, MISSIONS, missionsDone, DEFAULT_BUILD } from '../data/parts.js';
let build=loadBuild();
const $=id=>document.getElementById(id);
function render(){
  $('parts').innerHTML=PART_TYPES.map(t=>{ const cur=partOf(t.key,build[t.key]);
    return `<div class="row"><h3>${t.emoji} ${t.name}</h3><div class="opts">${t.opts.map(o=>
      `<button data-t="${t.key}" data-o="${o.id}" id="p-${t.key}-${o.id}" class="${o.id===cur.id?'on':''}">${o.name}</button>`).join('')}</div>
      <div class="why">${cur.why}</div></div>`; }).join('');
  const s=specOf(build);
  $('bars').innerHTML=bars(s).map(b=>`<div class="bar" data-k="${b.key}"><span class="n">${b.name}</span><span class="t"><i style="width:${b.v}%"></i><b></b></span><span class="v">${b.v}</span></div>`).join('');
  const e=enduranceSec(s), std=enduranceSec(specOf(DEFAULT_BUILD));
  $('sum').innerHTML=`這台：<b>${buildLabel(build)}</b><br>滿電大約可以飛 <b>${e} 秒</b>（標準機約 ${std} 秒）。3 圈大約：操場入門 50～90 秒、體育館 60～90 秒、森林峽谷 80～120 秒、城市高樓 90～130 秒、夜間霓虹 100～150 秒（看技術）。${e>=85?'續航很長：連最長的夜間霓虹都有機會不進站。':e>=65?'飛得夠快的話，操場有機會不進站跑完。':e>=40?'中途大概要進站 1 次。':'中途要進站 2 次以上。'}`;
  const d=missionsDone();
  $('miss').innerHTML=MISSIONS.map(m=>`<li class="${d[m.id]?'done':''}">${d[m.id]?'✅':'⬜'} ${m.name}${d[m.id]?`<small>完成（${d[m.id].build}）</small>`:`<small>${m.hint}</small>`}</li>`).join('');
  document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{ build={...build,[b.dataset.t]:b.dataset.o}; saveBuild(build); render(); document.getElementById(b.id)?.focus(); });
}
$('b-reset').onclick=()=>{ build={...DEFAULT_BUILD}; saveBuild(build); render(); };
render();
window.__garage={get build(){return build;}};
</script>
<script type="module" src="../core/gp-nav-boot.js"></script>
</body>
</html>
